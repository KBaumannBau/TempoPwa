# ============================================================
# Tempo: Build, Test und Deploy nach Mittwald (rsync über SSH)
#   API (Symfony)  -> /home/p-yt27xz/html/tempo-api
#   PWA (Vite)     -> /home/p-yt27xz/html/tempo-app
# Deployt wird nur, wenn API und PWA beide fehlerfrei gebaut und getestet sind.
#
# Secrets im Repo (Settings → Secrets and variables → Actions), wie in TempoVibe:
#   TEMPO_SSH_PRIVATE_KEY, TEMPO_SSH_HOST, TEMPO_SSH_USER, TEMPO_SSH_PORT
# Für die Datenbank der API (wird beim Deploy in tempo-api/.env.local ergänzt, falls dort noch nicht gesetzt):
#   TEMPO_API_DATABASE_URL
# Version: Datei VERSION im Wurzelordner (gepflegt von ./deployment.sh).
#   Push auf main  -> Build-Version "X.Y.Z+<commit>" auf die Testinstanz
#   Tag vX.Y.Z     -> Release "X.Y.Z": Tag muss zu VERSION passen, Deploy und GitHub-Release
# Optional:
#   Secrets  TEMPO_BASIC_AUTH_USER, TEMPO_BASIC_AUTH_PASSWORD  – Basic Auth vor der PWA
#            (ohne Secrets gilt wie in TempoVibe kbaumann/kbaumann)
#   Variable TEMPO_API_URL – Adresse der API, wenn sie nicht unter derselben Domain wie die PWA
#            unter /api läuft (z. B. https://api.example.de). Leer = gleicher Origin.
# ============================================================
name: Deploy to Mittwald

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Manuell (Redeploy): Actions → "Deploy to Mittwald" → Run workflow
  workflow_dispatch:

concurrency:
  group: deploy-tempo
  cancel-in-progress: false

env:
  TARGET_API: /home/p-yt27xz/html/tempo-api/
  TARGET_APP: /home/p-yt27xz/html/tempo-app/
  # Adressen der Testinstanz (CORS und DEFAULT_URI der API)
  API_ORIGIN: https://tempo-api.p-yt27xz.project.space
  APP_ORIGIN: https://tempo-app.p-yt27xz.project.space

jobs:
  # ---------------------------------------------------------------- Version
  version:
    name: Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      deploy: ${{ steps.v.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - id: v
        name: Version aus VERSION
        run: |
          set -euo pipefail
          basis="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$basis" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION enthält keine gültige Version: '$basis'"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$basis" ]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION ($basis)."; exit 1
            fi
            version="$basis"; release=true; deploy=true
          else
            version="$basis+${GITHUB_SHA::7}"; release=false; deploy=true
            # Trägt der Commit schon ein Release-Tag, deployt der Tag-Lauf (sonst zwei Deploys um die Wette)
            if git tag --points-at HEAD | grep -qx "v$basis"; then
              deploy=false
              echo "::notice::Commit ist als v$basis getaggt – Deploy übernimmt der Lauf für das Tag."
            fi
          fi
          echo "Version: $version (Release: $release, Deploy: $deploy)"
          {
            echo "version=$version"
            echo "release=$release"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- API
  api:
    name: API bauen und testen
    needs: version
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: tempo
          POSTGRES_USER: tempo
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempo -d tempo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://tempo:ci@127.0.0.1:5432/tempo?serverVersion=17&charset=utf8
      APP_SECRET: ci-nur-fuer-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PHP 8.4 einrichten
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Composer-Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('api/composer.lock') }}

      # Tests mit allen Abhängigkeiten
      - name: composer install (mit dev)
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          APP_ENV: test

      - name: Testdatenbank anlegen
        run: php bin/console doctrine:database:create --env=test --if-not-exists

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Container prüfen (prod)
        run: php bin/console lint:container --env=prod --no-debug
        env:
          APP_ENV: prod

      # Auslieferung: ohne dev-Pakete, ohne Tests
      - name: composer install (prod)
        run: |
          rm -rf vendor var
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts
          APP_ENV=prod APP_DEBUG=0 php bin/console assets:install public --env=prod --no-debug
          rm -rf var

      - name: Apache-Dateien, Deploy-Skript und Version einfügen
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf '%s\n' "$APP_VERSION" > VERSION
          cp ../deploy/mittwald/api/.htaccess .htaccess
          cp ../deploy/mittwald/api/public/.htaccess public/.htaccess
          cp ../deploy/mittwald/api/nach-dem-deploy.sh nach-dem-deploy.sh
          cp ../deploy/mittwald/api/.env.local.example .env.local.example

      - name: Paket packen
        run: |
          tar -czf ../api-build.tgz \
            --exclude=./tests --exclude=./.phpunit.cache --exclude=./phpunit.dist.xml \
            --exclude=./.env.test --exclude=./.env.local --exclude=./AGENTS.md --exclude=./.editorconfig \
            .

      - uses: actions/upload-artifact@v7
        with:
          name: api-build
          path: api-build.tgz
          retention-days: 3

  # ---------------------------------------------------------------- PWA
  app:
    name: PWA bauen
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: npm ci
        run: npm ci

      # Typecheck (tsc -b) + Vite-Build → dist/. Ein TypeScript-Fehler bricht hier ab.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.TEMPO_API_URL }}
          APP_VERSION: ${{ needs.version.outputs.version }}

      # .htaccess aus der Vorlage mit Basic Auth (APR1-MD5, von Apache unterstützt).
      # ACME-Challenges bleiben offen, sonst scheitert die Zertifikatsverlängerung still.
      - name: .htaccess und Basic Auth
        env:
          # Wie in TempoVibe: Testinstanz nicht öffentlich, Standard kbaumann/kbaumann.
          # Eigene Zugangsdaten über die Secrets TEMPO_BASIC_AUTH_USER/TEMPO_BASIC_AUTH_PASSWORD.
          BASIC_AUTH_USER: ${{ secrets.TEMPO_BASIC_AUTH_USER || 'kbaumann' }}
          BASIC_AUTH_PASSWORD: ${{ secrets.TEMPO_BASIC_AUTH_PASSWORD || 'kbaumann' }}
        run: |
          set -euo pipefail
          cp ../deploy/mittwald/app/htaccess.vorlage dist/.htaccess
          if [ -n "$BASIC_AUTH_USER" ] && [ -n "$BASIC_AUTH_PASSWORD" ]; then
            printf '%s:%s\n' "$BASIC_AUTH_USER" "$(openssl passwd -apr1 "$BASIC_AUTH_PASSWORD")" > dist/.htpasswd
            cat > auth.txt <<AUTH
          AuthType Basic
          AuthName "Tempo"
          AuthUserFile ${TARGET_APP}.htpasswd
          <RequireAny>
              Require expr "%{REQUEST_URI} =~ m#^/\.well-known/acme-challenge/#"
              Require valid-user
          </RequireAny>
          <Files ".htpasswd">
              Require all denied
          </Files>
          AUTH
          else
            echo "::error::Basic Auth ohne Benutzer oder Passwort – Deploy abgebrochen."
            exit 1
          fi
          sed -i -e '/# @@BASIC_AUTH@@/{r auth.txt' -e 'd}' dist/.htaccess
          rm auth.txt
          cat dist/.htaccess

      - uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: pwa/dist/
          include-hidden-files: true
          retention-days: 3

  # ---------------------------------------------------------------- Deploy
  # Zwei getrennte Deploy-Jobs: Scheitert das Server-Skript der API, kommt die PWA trotzdem an
  # (und umgekehrt). Beide starten nur, wenn API und PWA fehlerfrei gebaut sind.
  deploy-api:
    name: Deploy API nach Mittwald
    needs: [version, api, app]
    if: needs.version.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api-build
          path: .

      - name: API entpacken
        run: mkdir api && tar -xzf api-build.tgz -C api

      # Werte für die .env.local auf dem Server. nach-dem-deploy.sh übernimmt daraus nur, was dort
      # fehlt oder noch ein Platzhalter ist, und löscht die Datei danach. APP_SECRET entsteht auf dem Server.
      # Die Datei entsteht erst hier im Deploy-Job und steckt nicht im Build-Artefakt.
      - name: Erstanlage für .env.local
        env:
          DATABASE_URL: ${{ secrets.TEMPO_API_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          # Ohne Secret bleibt die DATABASE_URL auf dem Server, wie sie ist. Fehlt sie dort ganz,
          # meldet das nach-dem-deploy.sh im nächsten Schritt.
          {
            echo "APP_ENV=prod"
            echo "APP_DEBUG=0"
            if [ -n "$DATABASE_URL" ]; then printf 'DATABASE_URL="%s"\n' "$DATABASE_URL"; fi
            printf "CORS_ALLOW_ORIGIN='%s'\n" "^${APP_ORIGIN//./\\.}\$"
            echo "DEFAULT_URI=${API_ORIGIN}"
          } > api/.env.local.erstanlage
          sed -e 's/^DATABASE_URL=.*/DATABASE_URL="***"/' api/.env.local.erstanlage

      # API: --delete entfernt, was nicht mehr im Build ist. Geschützt (EXCLUDE) bleiben
      # .env.local (Geheimnisse, nur auf dem Server), var/ (Cache, Logs) und ACME-Challenges.
      # Mit synchronisiert: .env.local.example (Beispiel) und .env.local.erstanlage (wird vom Skript verbraucht).
      # Danach auf dem Server: .env.local anlegen/ergänzen, Cache aufbauen, Migrationen.
      - name: API deployen (tempo-api)
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.TEMPO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.TEMPO_SSH_HOST }}
          REMOTE_USER: ${{ secrets.TEMPO_SSH_USER }}
          REMOTE_PORT: ${{ secrets.TEMPO_SSH_PORT }}
          SOURCE: api/
          TARGET: ${{ env.TARGET_API }}
          ARGS: "-rlptgoDzv --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no,-o IdentitiesOnly=yes"
          EXCLUDE: "/.env.local, /var/, /.well-known/"
          SCRIPT_AFTER: sh ${{ env.TARGET_API }}nach-dem-deploy.sh ${{ env.TARGET_API }}
          SCRIPT_AFTER_REQUIRED: "true"

  deploy-app:
    name: Deploy PWA nach Mittwald
    needs: [version, api, app]
    if: needs.version.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/

      # PWA: nur der Inhalt von dist/. --delete entfernt alte Hash-Assets.
      - name: PWA deployen (tempo-app)
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.TEMPO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.TEMPO_SSH_HOST }}
          REMOTE_USER: ${{ secrets.TEMPO_SSH_USER }}
          REMOTE_PORT: ${{ secrets.TEMPO_SSH_PORT }}
          SOURCE: app/
          TARGET: ${{ env.TARGET_APP }}
          ARGS: "-rlptgoDzv --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no,-o IdentitiesOnly=yes"
          EXCLUDE: "/.well-known/"

  # ---------------------------------------------------------------- Release
  # Nur für Tags vX.Y.Z: GitHub-Release mit automatisch erzeugten Notizen, nachdem beides deployt ist.
  # Ein Prod-System gibt es noch nicht (Betrieb offen, CLAUDE.md); ein Prod-Deploy kommt hier dazu.
  release:
    name: GitHub-Release anlegen
    needs: [version, deploy-api, deploy-app]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Tempo $GITHUB_REF_NAME" --generate-notes --verify-tag
