# ============================================================
# Tempo: build, test and deploy to Mittwald (rsync over SSH)
#   API (Symfony)  -> /home/p-yt27xz/html/tempo-api
#   PWA (Vite)     -> /home/p-yt27xz/html/tempo-app
# Deploys only when API and PWA are both built and tested without errors.
#
# Secrets in the repo (Settings → Secrets and variables → Actions), as in TempoVibe:
#   TEMPO_SSH_PRIVATE_KEY, TEMPO_SSH_HOST, TEMPO_SSH_USER, TEMPO_SSH_PORT
# For the database of the API (added to tempo-api/.env.local during the deploy if not set there yet):
#   TEMPO_API_DATABASE_URL
# Version: file VERSION in the root folder (maintained by ./deployment.sh).
#   Push to main   -> build version "X.Y.Z+<commit>" on the test instance
#   Tag vX.Y.Z     -> release "X.Y.Z": the tag must match VERSION, deploy and GitHub release
# Optional:
#   Variable TEMPO_API_URL – address of the API if it does not run on the same domain as the PWA
#            under /api (e.g. https://api.example.de). Empty = same origin.
# ============================================================
name: Deploy to Mittwald

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Manually (redeploy): Actions → "Deploy to Mittwald" → Run workflow
  workflow_dispatch:

concurrency:
  group: deploy-tempo
  cancel-in-progress: false

env:
  TARGET_API: /home/p-yt27xz/html/tempo-api/
  TARGET_APP: /home/p-yt27xz/html/tempo-app/
  # Addresses of the test instance (CORS and DEFAULT_URI of the API)
  API_ORIGIN: https://tempo-api.p-yt27xz.project.space
  APP_ORIGIN: https://tempo-app.p-yt27xz.project.space

jobs:
  # ---------------------------------------------------------------- Version
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      deploy: ${{ steps.v.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - id: v
        name: Version from VERSION
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION enthält keine gültige Version: '$base'"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$base" ]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION ($base)."; exit 1
            fi
            version="$base"; release=true; deploy=true
          else
            version="$base+${GITHUB_SHA::7}"; release=false; deploy=true
            # If the commit already carries a release tag, the tag run deploys (otherwise two deploys race)
            if git tag --points-at HEAD | grep -qx "v$base"; then
              deploy=false
              echo "::notice::Commit ist als v$base getaggt – Deploy übernimmt der Lauf für das Tag."
            fi
          fi
          echo "Version: $version (Release: $release, Deploy: $deploy)"
          {
            echo "version=$version"
            echo "release=$release"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- API
  api:
    name: Build and test API
    needs: version
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: tempo
          POSTGRES_USER: tempo
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempo -d tempo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://tempo:ci@127.0.0.1:5432/tempo?serverVersion=17&charset=utf8
      APP_SECRET: ci-only-for-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('api/composer.lock') }}

      # Tests with all dependencies
      - name: composer install (with dev)
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          APP_ENV: test

      - name: Create and migrate test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Lint container (prod)
        run: php bin/console lint:container --env=prod --no-debug
        env:
          APP_ENV: prod

      # Delivery: without dev packages, without tests
      - name: composer install (prod)
        run: |
          rm -rf vendor var
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts
          APP_ENV=prod APP_DEBUG=0 php bin/console assets:install public --env=prod --no-debug
          rm -rf var

      - name: Add Apache files, deploy script and version
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf '%s\n' "$APP_VERSION" > VERSION
          cp ../deploy/mittwald/api/.htaccess .htaccess
          cp ../deploy/mittwald/api/public/.htaccess public/.htaccess
          cp ../deploy/mittwald/api/post-deploy.sh post-deploy.sh
          cp ../deploy/mittwald/api/.env.local.example .env.local.example

      - name: Pack package
        run: |
          tar -czf ../api-build.tgz \
            --exclude=./tests --exclude=./.phpunit.cache --exclude=./phpunit.dist.xml \
            --exclude=./.env.test --exclude=./.env.local --exclude=./AGENTS.md --exclude=./.editorconfig \
            .

      - uses: actions/upload-artifact@v7
        with:
          name: api-build
          path: api-build.tgz
          retention-days: 3

  # ---------------------------------------------------------------- PWA
  app:
    name: Build PWA
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: npm ci
        run: npm ci

      # Typecheck (tsc -b) + Vite build → dist/. A TypeScript error stops here.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.TEMPO_API_URL }}
          APP_VERSION: ${{ needs.version.outputs.version }}

      # .htaccess from the template (no basic auth: the test instance is open, the app has its own sign-in).
      # An old .htpasswd on the server is removed by the deploy via rsync --delete.
      - name: .htaccess
        run: |
          set -euo pipefail
          cp ../deploy/mittwald/app/htaccess.template dist/.htaccess
          cat dist/.htaccess

      - uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: pwa/dist/
          include-hidden-files: true
          retention-days: 3

  # ---------------------------------------------------------------- Deploy
  # Two separate deploy jobs: if the server script of the API fails, the PWA still arrives
  # (and vice versa). Both start only when API and PWA are built without errors.
  deploy-api:
    name: Deploy API to Mittwald
    needs: [version, api, app]
    if: needs.version.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api-build
          path: .

      - name: Unpack API
        run: mkdir api && tar -xzf api-build.tgz -C api

      # Values for the .env.local on the server. post-deploy.sh takes over only what is missing there
      # or still a placeholder, and deletes the file afterwards. APP_SECRET is generated on the server.
      # The file is created only here in the deploy job and is not part of the build artifact.
      - name: Initial values for .env.local
        env:
          DATABASE_URL: ${{ secrets.TEMPO_API_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          # Without the secret the DATABASE_URL on the server stays as it is. If it is missing there entirely,
          # post-deploy.sh reports it in the next step.
          {
            echo "APP_ENV=prod"
            echo "APP_DEBUG=0"
            if [ -n "$DATABASE_URL" ]; then printf 'DATABASE_URL="%s"\n' "$DATABASE_URL"; fi
            printf "CORS_ALLOW_ORIGIN='%s'\n" "^${APP_ORIGIN//./\\.}\$"
            echo "DEFAULT_URI=${API_ORIGIN}"
          } > api/.env.local.initial
          sed -e 's/^DATABASE_URL=.*/DATABASE_URL="***"/' api/.env.local.initial

      # API: --delete removes what is no longer in the build. Protected (EXCLUDE) are
      # .env.local (secrets, only on the server), var/ (cache, logs) and ACME challenges.
      # Synced as well: .env.local.example (example) and .env.local.initial (consumed by the script).
      # Then on the server: create/complete .env.local, warm up the cache, migrations.
      - name: Deploy API (tempo-api)
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.TEMPO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.TEMPO_SSH_HOST }}
          REMOTE_USER: ${{ secrets.TEMPO_SSH_USER }}
          REMOTE_PORT: ${{ secrets.TEMPO_SSH_PORT }}
          SOURCE: api/
          TARGET: ${{ env.TARGET_API }}
          ARGS: "-rlptgoDzv --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no,-o IdentitiesOnly=yes"
          EXCLUDE: "/.env.local, /var/, /.well-known/"
          SCRIPT_AFTER: sh ${{ env.TARGET_API }}post-deploy.sh ${{ env.TARGET_API }}
          SCRIPT_AFTER_REQUIRED: "true"

  deploy-app:
    name: Deploy PWA to Mittwald
    needs: [version, api, app]
    if: needs.version.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/

      # PWA: only the content of dist/. --delete removes old hashed assets.
      - name: Deploy PWA (tempo-app)
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.TEMPO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.TEMPO_SSH_HOST }}
          REMOTE_USER: ${{ secrets.TEMPO_SSH_USER }}
          REMOTE_PORT: ${{ secrets.TEMPO_SSH_PORT }}
          SOURCE: app/
          TARGET: ${{ env.TARGET_APP }}
          ARGS: "-rlptgoDzv --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no,-o IdentitiesOnly=yes"
          EXCLUDE: "/.well-known/"

  # ---------------------------------------------------------------- Release
  # Only for tags vX.Y.Z: GitHub release with generated notes after both are deployed.
  # There is no prod system yet (operations open, CLAUDE.md); a prod deploy is added here.
  release:
    name: Create GitHub release
    needs: [version, deploy-api, deploy-app]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Tempo $GITHUB_REF_NAME" --generate-notes --verify-tag
