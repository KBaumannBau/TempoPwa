; Eigene PHP-Einstellungen, gemountet als conf.d/zzz_myPhp.ini
date.timezone = Europe/Berlin
memory_limit = 512M
max_execution_time = 300
short_open_tag = Off
upload_max_filesize = 40M
post_max_size = 40M
expose_php = Off

log_errors = On
error_log = /var/www/html/log/php-fpm-error.log

; Xdebug: startet nur mit Trigger (XDEBUG_TRIGGER / Browser-Erweiterung), sonst bremst es jede Anfrage
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = phpstorm
xdebug.log_level = 0

; OPcache: in dev Dateien bei jeder Anfrage prüfen
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
