# Ein Origin für PWA und API:
#   /api, /bundles, /_profiler, /_wdt  -> PHP-FPM (Symfony, api/public)
#   /                                  -> PWA (dev: Vite-Devserver mit HMR, prod: pwa/dist)

# Websocket-Upgrade für den HMR-Kanal von Vite
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8001;
    server_name localhost;

    root /var/www/html/api/public;

    # Docker-DNS: Dienste erst zur Anfragezeit auflösen, damit nginx auch startet,
    # wenn z. B. der pwa-Dienst gerade nicht läuft
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Optionale Basic Auth (erzeugt von start.sh)
    include /etc/nginx/basic-auth.conf;

    # Security-Header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self' data: blob: 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data: blob:" always;

    # Versteckte Dateien sperren (/.well-known bleibt offen, /node_modules/.vite braucht der Devserver)
    location ~ /\.(?!well-known/|vite/) {
        deny all;
    }
    # Symfony-Verzeichnisse sperren (liegen ohnehin außerhalb von api/public; /src/ nicht,
    # das liefert in dev der Vite-Devserver aus)
    location ~ ^/(config|templates|translations|var|vendor|migrations|tests)/ {
        deny all;
    }
    location ~ ^/(\.env.*|composer\.(json|lock)|package(-lock)?\.json|symfony\.lock)$ {
        deny all;
    }

    # --- Symfony ---------------------------------------------------------------
    location ~ ^/(api|bundles|_profiler|_wdt)(/|$) {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        internal;
    }

    # Kein anderes PHP-Skript ausführen
    location ~ \.php$ {
        return 404;
    }

    # --- PWA (dev oder prod, gewählt in start.sh) ------------------------------
    include /etc/nginx/pwa.conf;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log main;
}
