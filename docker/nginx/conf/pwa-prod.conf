# prod: statischer Build aus pwa/dist, Client-Routing über index.html
location / {
    root /var/www/html/pwa/dist;
    try_files $uri /index.html;
}

# Service Worker, Manifest und Einstieg nie cachen, damit Updates sofort ankommen
location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
    root /var/www/html/pwa/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Manifest und App-Icons ohne Basic Auth: Das Handy lädt sie beim Installieren ohne Zugangsdaten,
# sonst fehlt das K.-Baumann-Logo auf dem Home-Bildschirm (wie die .htaccess auf Mittwald)
location = /manifest.webmanifest {
    auth_basic off;
    root /var/www/html/pwa/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
location ~ ^/(favicon\.svg|icons/[A-Za-z0-9._-]+\.(png|svg))$ {
    auth_basic off;
    root /var/www/html/pwa/dist;
    try_files $uri =404;
}

# Gebaute Dateien mit Hash im Namen dürfen lange gecacht werden
location /assets/ {
    root /var/www/html/pwa/dist;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
