# prod: static build from pwa/dist, client routing via index.html
location / {
    root /var/www/html/pwa/dist;
    try_files $uri /index.html;
}

# Never cache service worker, manifest and entry point, so updates arrive at once
location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
    root /var/www/html/pwa/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Manifest and app icons without basic auth: the phone loads them without credentials when installing,
# otherwise the K. Baumann logo is missing on the home screen (like the .htaccess on Mittwald)
location = /manifest.webmanifest {
    auth_basic off;
    root /var/www/html/pwa/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
location ~ ^/(favicon\.svg|icons/[A-Za-z0-9._-]+\.(png|svg))$ {
    auth_basic off;
    root /var/www/html/pwa/dist;
    try_files $uri =404;
}

# Built files with a hash in the name may be cached for a long time
location /assets/ {
    root /var/www/html/pwa/dist;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
