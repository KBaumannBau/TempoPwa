# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            # Domain objects and value objects are not services
            - '../src/*/Domain/*.php'
            - '../src/*/Api/Resource/'
            - '../src/*/Application/{LoginCommand,LoginResult,SetPasswordCommand,RegistrationTicket,AuthenticatedDevice,Profile,IssuedLetter}.php'
            - '../src/Kernel.php'

    # Ports of the access context
    App\Access\Domain\AccountRepository: '@App\Access\Infrastructure\Doctrine\DoctrineAccountRepository'
    App\Access\Domain\InvitationRepository: '@App\Access\Infrastructure\Doctrine\DoctrineInvitationRepository'
    App\Access\Domain\DeviceRepository: '@App\Access\Infrastructure\Doctrine\DoctrineDeviceRepository'
    App\Access\Domain\PasswordHasher: '@App\Access\Infrastructure\Security\SymfonyPasswordHasher'
    App\Access\Application\UnitOfWork: '@App\Access\Infrastructure\Doctrine\DoctrineUnitOfWork'
    App\Access\Application\ProfileReader: '@App\Access\Infrastructure\Doctrine\DbalProfileReader'
    App\Access\Application\LoginThrottle: '@App\Access\Infrastructure\Security\CacheLoginThrottle'

    App\Access\Infrastructure\Security\CacheLoginThrottle:
        arguments:
            $cache: '@access.login_throttle'
