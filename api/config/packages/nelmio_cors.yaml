nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        # With an API on another domain the PWA sends credentials: 'include' (cookie sign-in, ADR 0002).
        # Without this header the browser drops the response. Only the origins from CORS_ALLOW_ORIGIN are allowed.
        allow_credentials: true
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        # Date: clock offset of the phone (docs/pwa/offline.md), Retry-After: sign-in lock (docs/pwa/authentication.md)
        expose_headers: ['Link', 'Date', 'Retry-After']
        max_age: 3600
    paths:
        '^/': null
