api_platform:
    title: Tempo API
    description: 'Stundenerfassung K. Baumann Bau – REST-API für die PWA'
    # Version aus der Datei VERSION (siehe Kernel), erscheint als Badge im Kopf von /api/docs
    version: '%app.version%'
    # Ressourcen sind eigene DTOs je Kontext (src/<Kontext>/Api/Resource), keine Doctrine-Entities.
    mapping:
        paths: ['%kernel.project_dir%/src']
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    docs_formats:
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    error_formats:
        jsonproblem: ['application/problem+json']
        jsonld: ['application/ld+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
