api_platform:
    title: Tempo API
    description: 'Stundenerfassung K. Baumann Bau – REST-API für die PWA'
    # Version from the file VERSION (see Kernel), shown as a badge in the header of /api/docs
    version: '%app.version%'
    # Resources are dedicated DTOs per context (src/<Context>/Api/Resource), no Doctrine entities.
    # Only the resource folders: src/ also holds Doctrine XML mappings, which API Platform must not read.
    # New context = add its Api/Resource folder here.
    mapping:
        paths:
            - '%kernel.project_dir%/src/System/Api/Resource'
            - '%kernel.project_dir%/src/Access/Api/Resource'
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    docs_formats:
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    error_formats:
        jsonproblem: ['application/problem+json']
        jsonld: ['application/ld+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
