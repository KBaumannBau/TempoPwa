security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        # Passwords and one-time passwords of the access context (App\Access\Infrastructure\Security\SymfonyPasswordHasher)
        access: { algorithm: auto }

    providers:
        # Users are loaded by the device authenticator (UserBadge loader); no provider lookup is needed
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            # Stateless: every request is authenticated by the HttpOnly cookie tempo_device (docs/pwa/authentication.md)
            pattern: ^/api
            stateless: true
            lazy: true
            provider: users_in_memory
            custom_authenticators:
                - App\Access\Infrastructure\Security\DeviceCookieAuthenticator
            entry_point: App\Access\Infrastructure\Security\DeviceCookieAuthenticator
        main:
            lazy: true
            provider: users_in_memory

    # Access is decided per operation (CurrentDevice); sign-in, health and docs are public
    access_control: []

when@test:
    security:
        password_hashers:
            # Hashing is slow by design; cheap settings keep the tests fast
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
            access:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
