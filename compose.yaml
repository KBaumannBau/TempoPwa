# Tempo – Stundenerfassung K. Baumann Bau
# Services: nginx (entry, one origin), php (PHP-FPM, Symfony + API Platform),
#           database (PostgreSQL 17), pwa (Vite dev server, dev only).
#
# No secrets in this file. All values come from .env (ignored),
# template: .env.example. Required values stop the start with a message (${VAR:?}).

name: tempo

networks:
  app_network:
    driver: bridge

volumes:
  postgres17_data:

services:
  nginx:
    image: nginx:latest
    container_name: tempo-nginx
    ports:
      - ${HOST_IP:-0.0.0.0}:${HTTP_PORT:-8011}:8001
    volumes:
      - ./docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/conf/pwa-dev.conf:/etc/nginx/pwa/pwa-dev.conf:ro
      - ./docker/nginx/conf/pwa-prod.conf:/etc/nginx/pwa/pwa-prod.conf:ro
      - ./docker/nginx/start.sh:/usr/local/bin/tempo-start.sh:ro
      - .:/var/www/html:cached
      - ./log:/var/log/nginx
    environment:
      # dev = proxy to the Vite dev server (HMR), prod = static build from pwa/dist
      PWA_MODE: ${PWA_MODE:-dev}
      # Optional for test instances: "user:pass,user:pass" – empty = no basic auth
      BASIC_AUTH_USERS: ${BASIC_AUTH_USERS:-}
    command: ["/bin/sh", "/usr/local/bin/tempo-start.sh"]
    depends_on:
      - php
    restart: unless-stopped
    networks:
      - app_network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: tempo-php
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/myPhp.ini:/usr/local/etc/php/conf.d/zzz_myPhp.ini:ro
      - ./docker/php/home/:/home/www
    working_dir: /var/www/html/api
    environment:
      PHP_IDE_CONFIG: 'serverName=docker'
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER fehlt in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@database:5432/${POSTGRES_DB:-tempo}?serverVersion=17&charset=utf8
      DEFAULT_URI: http://localhost:${HTTP_PORT:-8011}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  database:
    image: postgres:17
    container_name: tempo-database
    ports:
      - ${HOST_IP:-0.0.0.0}:${DB_PORT:-5432}:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tempo}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - app_network

  pwa:
    image: node:22
    container_name: tempo-pwa
    user: node
    working_dir: /var/www/html/pwa
    volumes:
      - .:/var/www/html:cached
    environment:
      # Port on which the browser reaches nginx (for the HMR websocket)
      HTTP_PORT: ${HTTP_PORT:-8011}
      # On file systems without file events: VITE_POLLING=1
      VITE_POLLING: ${VITE_POLLING:-0}
      # Source for "npm run api:types" (inside the Docker network)
      API_SCHEMA_URL: http://nginx:8001/api/docs.jsonopenapi
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    restart: unless-stopped
    networks:
      - app_network
